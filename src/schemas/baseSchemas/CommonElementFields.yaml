# JSON Schema in YAML format for Mist-powered Common Element Fields
$schema: https://json-schema.org/draft/2019-09/schema
$id: mist.common-element-fields.schema.json-1.0.0
title: Mist-powered Common Element Fields
description: |
  Decides the style used by the element.
  Supported values are: "city", "otherscape" and "legend".
  If empty or not defined, the plugin's "Default System" setting is used.

type: object
properties: 
  system:
    type: string
    enum:
      - city
      - otherscape
      - legend
      - ""
    description: |
      Decides the style used by the theme.
      Supported values are: "city", "otherscape" and "legend"
      Anything else (including empty or not defined) will lead to using the "Default System" setting in the plugin settings.