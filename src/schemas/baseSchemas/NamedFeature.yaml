# JSON Schema in YAML format for Mist-powered Named Feature
$schema: https://json-schema.org/draft/2019-09/schema
$id: mist.named-feature.schema.json-1.0.0
title: Mist-powered Named Feature
description: |
  Schema for validating named feature.
  Each property name is the name of a move and its value is the
  description of that move.

type: object
propertyNames:
  minLength: 1

additionalProperties:
  $ref: mist.description.schema.json-1.0.0