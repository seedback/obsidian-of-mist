# JSON Schema in YAML format for Mist-powered EvaluatedTheme
$schema: https://json-schema.org/draft/2019-09/schema
$id: mist.evaluated-theme.schema.json-1.0.0
title: Mist-powered EvaluatedTheme
description: Schema for validating Mist-powered EvaluatedTheme Data

oneOf:
  # Single theme
  - allOf:
      - $ref: mist.theme.schema.json-1.0.0
      - not:
          required:
            - themes

  # Theme collection
  - type: object
    properties:
      themes:
        type: array
        items:
          $ref: mist.theme.schema.json-1.0.0
    required:
      - themes

  # Bare list of themes
  - type: array
    items:
      $ref: mist.theme.schema.json-1.0.0
  
unevaluatedProperties: false
errorMessage:
  unevaluatedProperties: |
    Theme contains an unknown property.
    Allowed properties: might, type, themebook, title, tags, power-tags,
    weakness-tags, story-tags, identity, mystery, ritual, itch, quest,
    attention, upgrade, improve, crack, fade, decay, abandon,
    milestone, slow-and-steady, system.