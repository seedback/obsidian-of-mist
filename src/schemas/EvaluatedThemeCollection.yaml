# JSON Schema in YAML format for Mist-powered ThemeCollection
$schema: https://json-schema.org/draft/2019-09/schema
$id: mist.theme-collection.schema.json-1.0.0
title: Mist-powered ThemeCollection
description: Schema for validating Mist-powered ThemeCollection Data

oneOf:
  # Single theme
  - allOf:
      - $ref: mist.theme.schema.json-1.0.0
      - not:
          required:
            - themes

  # Theme collection
  - type: object
    properties:
      themes:
        type: array
        items:
          $ref: mist.theme.schema.json-1.0.0
    required:
      - themes

  # Bare list of themes
  - type: array
    items:
      $ref: mist.theme.schema.json-1.0.0

unevaluatedProperties:
  not: true
  errorMessage: |
    Unknown theme property: ${0#}.
    Allowed properties for a theme are: might, type, themebook, title, tags, power-tags, weakness-tags, story-tags,
    [identity, mystery, ritual, itch, quest], [attention, upgrade, improve], [crack, fade, decay, abandon],
    milestone, slow-and-steady.
    A theme collection may instead contain a "themes" property holding a list of themes.
    Properties in square brackets are aliases for the same value; only one property from each alias group may be used.