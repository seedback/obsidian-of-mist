name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release plugin
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────

      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases may only be created from main."
          exit 1

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────────
      # Prepare version
      # ─────────────────────────────────────────────

      - name: Prepare release
        run: node scripts/prepare-release.mjs "${{ inputs.bump }}"

      - name: Get version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote \
            --exit-code \
            --tags origin \
            "refs/tags/$VERSION" > /dev/null 2>&1
          then
            echo "Tag $VERSION already exists."
            exit 1
          fi

      # ─────────────────────────────────────────────
      # Build
      # ─────────────────────────────────────────────

      - name: Build
        run: npm run build

      - name: Verify release
        run: node scripts/verify-release.mjs

      # ─────────────────────────────────────────────
      # Commit
      # ─────────────────────────────────────────────

      - name: Commit version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            manifest.json \
            versions.json

          git commit -m "chore: release $VERSION"

          git tag \
            -a "$VERSION" \
            -m "Release $VERSION"

      # ─────────────────────────────────────────────
      # Push
      # ─────────────────────────────────────────────

      - name: Push version and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push --atomic \
            origin \
            HEAD:main \
            "refs/tags/$VERSION"

      # ─────────────────────────────────────────────
      # Release
      # ─────────────────────────────────────────────

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            manifest.json \
            main.js \
            styles.css \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes